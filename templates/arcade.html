<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RehabOpt AR — Arcade Arena</title>
  <link rel="stylesheet" href="/static/css/arcade.css" />
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="arcade-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <a href="/dashboard" class="back-btn">← Back</a>
      <h2>🎮 Arcade Arena</h2>
      <span style="font-size:12px; color:#a08a70;">Session 2</span>
    </div>

    <!-- HUD Bar -->
    <div class="hud-bar">
      <div class="hud-item">
        <div class="label">Score</div>
        <div class="value" id="score-display">0</div>
      </div>
      <div class="hud-item">
        <div class="label">⏱️ Time</div>
        <div class="value" id="timer-display">00:00</div>
      </div>
      <div class="hud-item">
        <div class="label">⚡ Combo</div>
        <div class="value" id="combo-display">—</div>
      </div>
      <div class="hud-item">
        <div class="label">Lives</div>
        <div class="value" id="hearts-display">❤️❤️❤️</div>
      </div>
    </div>

    <!-- Game Area -->
    <div class="game-area">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="hand-canvas"></canvas>
      <canvas id="game-canvas"></canvas>

      <!-- Mode Menu -->
      <div id="mode-menu">
        <button id="btn-flappy" class="mode-btn">
          🐦 Flappy Kinetic
          <span class="desc">Wrist extension to flap • Navigate through pipes</span>
        </button>
        <button id="btn-fruit" class="mode-btn">
          🍉 Fruit Ballistic
          <span class="desc">Open palm to slice • Avoid 💣 hazards</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  {% include '_ai_widget.html' %}
  <script src="/static/js/kinematics.js"></script>
  <script src="/static/js/camera.js"></script>
  <script src="/static/js/streak_manager.js"></script>
  <script src="/static/js/arcade_engine.js"></script>
</body>
</html>
