<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F2A4A" />
  <title>RehabOpt AR — Main Workspace</title>
  <link rel="stylesheet" href="/static/css/clinical.css" />
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="app-frame" data-shell="true">
    {% include '_clinical_rail.html' %}

    <main class="app-main" id="app-main">
      {% include '_clinical_topbar.html' %}
      {% block content %}
        {% block extra_body %}{% endblock %}
      {% endblock %}
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  {% include '_ai_widget.html' %}
  {% block scripts %}{% endblock %}
</body>
</html>
