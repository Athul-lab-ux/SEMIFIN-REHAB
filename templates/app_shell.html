<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="{{ patient_theme_color or '#0F2A4A' }}" />
  <title>RehabOpt AR — Main Workspace</title>
  <link rel="stylesheet" href="/static/css/clinical.css" />
  <script>
    (function() {
      const serverTheme = "{{ patient_theme_color or '' }}";
      const localTheme = localStorage.getItem("rehab_theme_color");
      const activeTheme = localTheme || serverTheme || "#FF6A00";
      if (activeTheme) {
        document.documentElement.style.setProperty("--clin-orange", activeTheme);
        document.documentElement.style.setProperty("--clin-brand", activeTheme);
        if (!localTheme && serverTheme) {
          try { localStorage.setItem("rehab_theme_color", serverTheme); } catch(e) {}
        }
      }
    })();
  </script>
  <style id="rehab-theme-styles">
    :root {
      --clin-orange: {{ patient_theme_color or '#FF6A00' }} !important;
      --clin-brand: {{ patient_theme_color or '#FF6A00' }} !important;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="app-frame" data-shell="true">
    {% include '_clinical_rail.html' %}

    <main class="app-main" id="app-main">
      {% include '_clinical_topbar.html' %}
      {% block content %}
        {% block extra_body %}{% endblock %}
      {% endblock %}
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  {% include '_ai_widget.html' %}

  <!-- Core MediaPipe Vision Libraries (Pre-cached and non-blocking for instant camera access) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
