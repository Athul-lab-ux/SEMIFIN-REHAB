<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F2A4A" />
  <title>RehabOpt — Secure Patient Portal</title>
  <link rel="stylesheet" href="/static/css/clinical.css" />
  <link rel="stylesheet" href="/static/css/auth.css" />
</head>
<body>
  <!-- Doctor Stethoscope Background with 25-30% Optical Blur -->
  <div class="auth-bg-layer" aria-hidden="true">
    <div class="auth-bg-img"></div>
    <div class="auth-bg-tint"></div>
  </div>

  <main class="auth-wrap">
    <!-- Focused Patient Authentication Card -->
    <section class="auth-card" aria-label="Patient portal">
      <div class="auth-card-inner">
        <!-- Top branding inside card -->
        <div class="auth-brand-center">
          <span class="auth-mark">🏥</span>
          <div>
            <h1>RehabOpt</h1>
            <p class="auth-tagline">Neuro-Rehabilitation Tele-Platform</p>
          </div>
        </div>

        <div class="ac-head">
          <h2 id="auth-title">Patient Sign In</h2>
          <p class="ac-sub">Secure clinical access · session expires after 2 h</p>
        </div>

        <!-- Segmented tab switch -->
        <div class="tab-bar" role="tablist" aria-label="Sign in or register">
          <button id="sign-in-tab" class="tab active" role="tab" aria-selected="true">Sign In</button>
          <button id="register-tab" class="tab" role="tab" aria-selected="false">New Patient</button>
        </div>

        <!-- Sign In Panel -->
        <div id="sign-in-panel" class="panel visible" role="tabpanel" aria-live="polite">
          <form id="sign-in-form" novalidate>
            <div class="input-group">
              <label for="si-patient-id">🪪 Patient ID, Email, or Username</label>
              <input type="text" id="si-patient-id" placeholder="e.g. SP-000000001, u1, or your email" autocomplete="username" required />
            </div>
            <div class="input-group">
              <label for="si-password">🔒 Password</label>
              <div class="pw-field">
                <input type="password" id="si-password" placeholder="Enter password" autocomplete="current-password" required />
                <button type="button" class="toggle-pw" aria-label="Show password">👁️</button>
              </div>
            </div>
            <button type="submit" class="clin-btn clin-btn-primary auth-submit">🔓 Sign In</button>
          </form>
          <p class="switch-link">
            New patient or don't have an ID?
            <a href="#" id="go-register">Create an account here ➜</a>
          </p>
          <button id="demo-btn" class="btn-demo">⚡ Quick Demo Account</button>
        </div>

        <!-- Register Panel -->
        <div id="register-panel" class="panel" role="tabpanel" aria-live="polite">
          <form id="register-form" novalidate>
            <div class="input-group">
              <label for="reg-name">👤 Full Name / Patient Name</label>
              <input type="text" id="reg-name" placeholder="e.g. Athul or Patient 1" autocomplete="name" required />
            </div>
            <div class="input-group">
              <label for="reg-email">📧 Email or Username</label>
              <input type="text" id="reg-email" placeholder="e.g. u1 or you@hospital.org" autocomplete="username" required />
            </div>
            <div class="input-group">
              <label for="reg-password">🔒 Create Password</label>
              <div class="pw-field">
                <input type="password" id="reg-password" placeholder="Min 6 characters" autocomplete="new-password" required minlength="6" />
                <button type="button" class="toggle-pw" aria-label="Show password">👁️</button>
              </div>
            </div>
            <div class="input-group">
              <label for="reg-password2">🔒 Confirm Password</label>
              <div class="pw-field">
                <input type="password" id="reg-password2" placeholder="Repeat password" autocomplete="new-password" required minlength="6" />
                <button type="button" class="toggle-pw" aria-label="Show password">👁️</button>
              </div>
            </div>
            <button type="submit" class="clin-btn clin-btn-secondary auth-submit">📋 Register Patient Profile</button>
          </form>
          <p class="switch-link">
            Already registered?
            <a href="#" id="go-signin">Sign in with your account ➜</a>
          </p>
        </div>

        <div class="security-row">
          <span class="security-badge">🔒 Zero-Leak Privacy</span>
          <span class="security-badge">🏥 Hospital Grade</span>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/static/js/auth.js"></script>
</body>
</html>
