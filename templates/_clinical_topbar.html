<!-- RehabOpt AR — Hospital Diagnostic Top Command Bar (Part 5.2) -->
<div class="top-clinical-bar" role="toolbar" aria-label="Clinical controls">
  <!-- Brand + primary actions -->
  <div class="tb-group">
    <a href="/dashboard" class="tb-brand" id="tb-brand" style="text-decoration:none;">
      <span style="font-weight:800; letter-spacing:-0.2px;">🏥 RehabOpt AR</span>
    </a>
    <div class="tb-mini">
      <a href="/logout" class="tb-icon-btn" title="Sign out">🚪</a>
      <a href="/profile" class="tb-icon-btn" title="Patient Profile">👤</a>
      <a href="/report" class="tb-icon-btn" title="Clinical report">📋</a>
    </div>
  </div>

  <!-- Patient identity + streak -->
  <div class="tb-group">
    <div>
      <a href="/profile" class="tb-patient" style="text-decoration:none;" title="View and edit Patient Profile">🪪 <span id="tb-patient-id">SP-000000001</span></a>
      <div class="tb-sub"><span id="tb-streak">🔥 1 Day</span></div>
    </div>
  </div>

  <!-- Deficit profile selector -->
  <div class="tb-group">
    <select id="tb-condition-select" class="tb-select" aria-label="Clinical deficit profile">
      <option value="Hemiparesis">🦾 Hemiparesis</option>
      <option value="Flexor Spasticity">✋ Flexor Spasticity</option>
      <option value="Motor Ataxia">🎯 Motor Ataxia</option>
      <option value="Intention Tremor">🫨 Intention Tremor</option>
      <option value="Motor Apraxia">🧠 Motor Apraxia</option>
      <option value="Wrist Drop">🤚 Wrist Drop</option>
      <option value="Lower-Limb">🦵 Lower-Limb / Crural</option>
    </select>
  </div>

  <!-- Camera device (session pages only) -->
  <div class="tb-group" id="tb-camera-group" style="display:none;">
    <select id="tb-camera" class="tb-select" disabled aria-label="Camera input device">
      <option value="">Loading cameras…</option>
    </select>
  </div>

  <!-- Audio biofeedback toggle -->
  <div class="tb-group">
    <button id="tb-audio" class="tb-icon-btn active" aria-label="Toggle audio biofeedback" aria-pressed="true">🔊</button>
  </div>

  <!-- Visual mode -->
  <div class="tb-group">
    <select id="tb-visual" class="tb-select" aria-label="Visual mode">
      <option value="standard">👁️ Standard Medical</option>
      <option value="high-contrast">🔆 High Contrast</option>
      <option value="reduced-motion">🐢 Reduced Motion</option>
    </select>
  </div>

  <!-- Live telemetry badge -->
  <div class="tb-group" style="margin-left:auto;">
    <span class="tb-badge" id="tb-fps" aria-live="off">-- fps · —</span>
  </div>
</div>
