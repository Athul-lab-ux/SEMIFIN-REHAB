{% extends "app_shell.html" %}
{% block extra_head %}
  <link rel="stylesheet" href="/static/css/air_canvas.css" />
{% endblock %}
{% block extra_body %}
  <!-- Neon Air-Canvas workspace -->
  <section class="session-shell">
    <div class="sess-head">
      <div>
        <h2>🎨 Neon Air-Canvas</h2>
        <p class="sess-sub">Fingertip drawing · trajectory corridors · tremor readout</p>
      </div>
      <div class="sess-status">
        <span class="sess-badge" id="canvas-status">⏸ Paused</span>
        <span class="sess-badge" id="canvas-cam">📷 Camera off</span>
      </div>
    </div>

    <div class="sess-workspace canvas-grid">
      <div class="canvas-cam-stage">
        <video id="air-video" autoplay muted playsinline webkit-playsinline></video>
        <canvas id="air-overlay" class="overlay-canvas"></canvas>

        <div class="hud-cluster hemi-cluster">
          <div class="hud-row">
            <div class="hud-chip canvas-hud">
              <span class="hud-ico">📐</span>
              <div>
                <div class="hud-val" id="canvas-mode">Freeform</div>
                <div class="hud-lab">Active mode</div>
              </div>
            </div>
            <div class="hud-chip canvas-hud">
              <span class="hud-ico">📏</span>
              <div>
                <div class="hud-val" id="canvas-precision">—</div>
                <div class="hud-lab">Precision</div>
              </div>
            </div>
            <div class="hud-chip canvas-hud">
              <span class="hud-ico">🫨</span>
              <div>
                <div class="hud-val" id="canvas-tremor">— Hz</div>
                <div class="hud-lab">Tremor</div>
              </div>
            </div>
          </div>
        </div>

        <div class="canvas-countdown" id="canvas-countdown" role="status" aria-live="polite" hidden>
          <span class="count-num" id="count-num">4</span>
          <span class="count-label">Calibrating</span>
        </div>
      </div>

      <div class="canvas-tools" id="canvas-tools">
        <div class="canvas-tool-group">
          <span class="tool-group-label">Shapes</span>
          <div class="tool-row" id="shape-tools">
            <button type="button" class="tool-btn active" data-mode="free">✏️ Free</button>
            <button type="button" class="tool-btn" data-mode="line">📏 Line</button>
            <button type="button" class="tool-btn" data-mode="circle">⭕ Circle</button>
            <button type="button" class="tool-btn" data-mode="square">🟥 Square</button>
            <button type="button" class="tool-btn" data-mode="infinity">∞ Infinity</button>
            <button type="button" class="tool-btn" data-mode="triangle">🔺 Triangle</button>
          </div>
        </div>
        <div class="canvas-tool-group">
          <span class="tool-group-label">Templates</span>
          <div class="tool-row" id="template-tools">
            <button type="button" class="tool-btn" data-mode="spiral">🌀 Spiral</button>
            <button type="button" class="tool-btn" data-mode="star">⭐ Star</button>
            <button type="button" class="tool-btn" data-mode="figure8">8 Figure-8</button>
            <button type="button" class="tool-btn" data-mode="sine">〰️ Sine</button>
            <button type="button" class="tool-btn" data-mode="zigzag">⚡ Zigzag</button>
          </div>
        </div>
        <div class="canvas-tool-group">
          <span class="tool-group-label">Actions</span>
          <div class="tool-row">
            <button type="button" class="tool-btn tool-btn-warn" id="canvas-clear">🧹 Clear</button>
            <button type="button" class="tool-btn tool-btn-gesture" id="canvas-gesture-hint">✌️ Peace lift</button>
          </div>
        </div>
      </div>
    </div>

    <div class="sess-controls">
      <button id="canvas-start" class="clin-btn clin-btn-primary">▶ Start Canvas</button>
      <button id="canvas-stop" class="clin-btn clin-btn-secondary" disabled>⏹ Stop</button>
    </div>
  </section>
{% endblock %}
